# DPO training defaults shared by all methods. Identical across raw / noise_aware /
# single / consensus / oracle so that downstream differences are attributable to
# the filter, not the optimizer.
base_model: Qwen/Qwen2.5-1.5B-Instruct
epochs: 1.0
batch_size: 2
grad_accum: 8        # effective batch = 16
lr: 5.0e-6
beta: 0.1
max_length: 1024
max_prompt_length: 512
seed: 42
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# Method-specific overrides — only label_smoothing differs.
methods:
  raw:           { label_smoothing: 0.0 }
  noise_aware:   { label_smoothing: 0.1 }
  single:        { label_smoothing: 0.0 }
  consensus_k3:  { label_smoothing: 0.0 }
  oracle:        { label_smoothing: 0.0 }
